<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | Nural Islam</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- ADMIN LOGIN SCREEN -->
    <div class="admin-login">
        <div class="admin-form">
            <div class="logo" style="justify-content: center; margin-bottom: 30px;"><div class="logo-icon">🔒</div></div>
            <h2 style="color: var(--primary-green); margin-bottom: 20px;">Admin Portal</h2>
            <p style="color: var(--text-light); margin-bottom: 30px; font-size: 14px;">Restricted Access. Authorized Nural Islam admins only.</p>
            
            <form id="adminLoginForm">
                <input type="text" id="adminUser" placeholder="Username" required>
                <input type="password" id="adminPass" placeholder="Password" required>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Login to Dashboard</button>
            </form>
        </div>
    </div>

    <!-- ADMIN DASHBOARD (Hidden by default) -->
    <div class="admin-dashboard">
        <div class="container">
            <div class="section-header">
                <h2>Admin Dashboard</h2>
                <p>Manage News and Updates for Nural Islam</p>
            </div>
            
            <div style="background: white; padding: 40px; border-radius: 20px; box-shadow: var(--shadow-soft); max-width: 800px; margin: 0 auto;">
                <h3 style="color: var(--primary-green); margin-bottom: 20px;">Post a New Update</h3>
                <p style="color: var(--text-light); margin-bottom: 20px; font-size: 14px;">In the next phase, you will connect this to Google Sheets so your posts appear instantly on the home page.</p>
                
                <form style="display: flex; flex-direction: column; gap: 15px;">
                    <input type="text" placeholder="Update Title (e.g., Ramadan Schedule)" style="padding: 15px; border: 1px solid #ddd; border-radius: 8px;">
                    <textarea placeholder="Write your message here..." rows="5" style="padding: 15px; border: 1px solid #ddd; border-radius: 8px; font-family: inherit;"></textarea>
                    <input type="text" placeholder="Image URL (Optional)" style="padding: 15px; border: 1px solid #ddd; border-radius: 8px;">
                    <button type="button" class="btn btn-primary" style="width: 200px;">Publish Update</button>
                </form>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
